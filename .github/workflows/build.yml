# Builds a standalone executable for each platform.
#
# Push a tag like v1.0.2 and the finished binaries are attached to a release
# automatically. A push to main just builds and keeps them as artifacts.
name: Build

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            artifact: nonsteam-game-manager-windows
            binary: nonsteam-game-manager.exe
          - os: ubuntu-latest
            label: Linux
            artifact: nonsteam-game-manager-linux
            binary: nonsteam-game-manager
          - os: macos-latest
            label: macOS
            artifact: nonsteam-game-manager-macos
            binary: nonsteam-game-manager

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Rather than assume where the project sits, find it. The package has
      # lived at the root and inside src/ at different times, and a workflow
      # that hard-codes one of those breaks silently when the other is used.
      - name: Locate the project
        id: locate
        shell: bash
        run: |
          echo "::group::Repository contents"
          find . -maxdepth 3 -not -path "./.git/*" -not -path "./.git" | sort
          echo "::endgroup::"

          spec=$(find . -name "nsgm.spec" -not -path "./.git/*" | head -1)
          pkg=$(find . -name "__main__.py" -path "*/nsgm/*" -not -path "./.git/*" | head -1)

          if [ -z "$pkg" ]; then
            echo "::error::No nsgm package found. The nsgm/ folder with the .py files is missing from this repository."
            exit 1
          fi
          root=$(dirname "$(dirname "$pkg")")
          echo "Package found at: $(dirname "$pkg")"
          echo "Working from:     $root"

          if [ -z "$spec" ]; then
            echo "::error::nsgm.spec is missing. It must sit next to the nsgm/ folder, in $root"
            exit 1
          fi
          specdir=$(dirname "$spec")
          if [ "$specdir" != "$root" ]; then
            echo "::error::nsgm.spec is in $specdir but the package is in $root. They must be in the same folder."
            exit 1
          fi
          if [ ! -d "$root/nsgm/web" ]; then
            echo "::error::$root/nsgm/web is missing. The interface files are required and must be committed."
            exit 1
          fi
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Install the build tools
        shell: bash
        run: |
          python -m pip install --upgrade pip pyinstaller
          # Gives the app its own window instead of a browser tab. Optional
          # at runtime, so a platform where it will not install is not fatal.
          if python -m pip install pywebview; then
            python -c "import webview; print('pywebview OK')"
          else
            echo "::warning::pywebview did not install; this build opens a browser instead of a window"
          fi

      - name: Check it imports and starts
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          python -c "import nsgm, nsgm.server, nsgm.resolve, nsgm.steam; print('imports fine')"
          python -c "
          from nsgm import vdf, steam
          entry = steam.build_shortcut('Test', '/tmp/game.exe')
          blob = vdf.binary_dumps({'shortcuts': {'0': entry}})
          assert vdf.binary_loads(blob)['shortcuts']['0'] == entry
          assert steam.shortcut_id(entry['Exe'], entry['AppName']) == steam.entry_short_id(entry)
          print('shortcut round trip fine')
          "

      - name: Build
        working-directory: ${{ steps.locate.outputs.root }}
        run: pyinstaller nsgm.spec --clean --noconfirm

      - name: Check the binary runs
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          "dist/${{ matrix.binary }}" --version

      # Artifact paths are measured from the repository root, not from the
      # working directory, so the located folder is prefixed here.
      # A real installer: Start Menu entry, an uninstall entry, and a fixed
      # place on disk. Per-user, so it never asks for administrator rights.
      # Built in PowerShell, not bash. Git Bash on Windows rewrites any
      # argument beginning with "/" into a Windows path, so ISCC's own
      # switches (/DAppVersion=..., /O...) arrived as file names and it
      # refused with "You may not specify more than one script filename".
      - name: Build the Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            Write-Error "Inno Setup is not at $iscc"; exit 1
          }

          $root = "${{ steps.locate.outputs.root }}" -replace '^\./', ''
          if ([string]::IsNullOrWhiteSpace($root) -or $root -eq '.') { $dist = 'dist' }
          else { $dist = "$root\dist" }
          $dist = $dist -replace '/', '\'

          $ref = $env:GITHUB_REF_NAME
          if ($ref -match '^v(\d+(\.\d+)*)') { $version = $Matches[1] } else { $version = '1.0.0' }

          Write-Host "binary folder: $dist"
          Write-Host "version:       $version"
          Get-ChildItem $dist

          & $iscc "/DAppVersion=$version" "/DDistDir=$dist" "/O$dist" "installer.iss"
          if ($LASTEXITCODE -ne 0) { Write-Error "Inno Setup failed"; exit $LASTEXITCODE }
          Get-ChildItem $dist -Filter *.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ steps.locate.outputs.root }}/dist/${{ matrix.binary }}
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          name: nonsteam-game-manager-installer
          path: ${{ steps.locate.outputs.root }}/dist/nonsteam-game-manager-setup.exe
          if-no-files-found: error

      # macOS refuses to treat a bare Unix executable as an application:
      # double clicking one opens it in TextEdit. A .app bundle inside a
      # .dmg is what people expect to drag into Applications.
      - name: Package the macOS app
        if: matrix.os == 'macos-latest'
        shell: bash
        working-directory: ${{ steps.locate.outputs.root }}
        run: |
          ls -la dist
          test -d "dist/Non-Steam Game Manager.app" || {
            echo "::error::PyInstaller produced no .app bundle"; exit 1; }
          hdiutil create -volname "Non-Steam Game Manager" \
            -srcfolder "dist/Non-Steam Game Manager.app" \
            -ov -format UDZO "dist/nonsteam-game-manager-macos.dmg"
          ls -la dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest'
        with:
          name: nonsteam-game-manager-macos-dmg
          path: ${{ steps.locate.outputs.root }}/dist/nonsteam-game-manager-macos.dmg
          if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Give each build a distinct name
        run: |
          mkdir -p release
          cp artifacts/nonsteam-game-manager-windows/nonsteam-game-manager.exe \
             release/nonsteam-game-manager-windows.exe
          cp artifacts/nonsteam-game-manager-installer/nonsteam-game-manager-setup.exe \
             release/nonsteam-game-manager-setup.exe
          cp artifacts/nonsteam-game-manager-linux/nonsteam-game-manager \
             release/nonsteam-game-manager-linux
          cp artifacts/nonsteam-game-manager-macos/nonsteam-game-manager \
             release/nonsteam-game-manager-macos
          cp artifacts/nonsteam-game-manager-macos-dmg/nonsteam-game-manager-macos.dmg \
             release/nonsteam-game-manager-macos.dmg
          cd release && sha256sum * > checksums.txt && cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
