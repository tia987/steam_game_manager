[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nonsteam-game-manager"
version = "1.0.0"
description = "Add installed games, ROMs and downloads to Steam with artwork"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["steam", "shortcuts", "steamgriddb", "emulation", "roms"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Games/Entertainment",
]
# No runtime dependencies on purpose: the standard library covers all of it,
# so the app runs from a fresh Python with nothing to install.
dependencies = []

[project.scripts]
nsgm = "nsgm.__main__:main"

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools]
packages = ["nsgm"]

[tool.setuptools.package-data]
nsgm = ["web/*"]
